<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mind/Body Disconnect — Digital Mindscape</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            font-family: 'Courier New', monospace;
            background: #000;
            cursor: crosshair;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        #ui-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            color: #fff;
            font-size: 14px;
        }
        #intro-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.85);
            padding: 40px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 4px;
            text-align: center;
            opacity: 0;
            transition: opacity 1s;
            max-width: 600px;
            line-height: 1.8;
        }
        #path-hint {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            padding: 20px 30px;
            border: 1px solid rgba(255,255,255,0.3);
            text-align: center;
            opacity: 0;
            transition: opacity 0.5s;
            max-width: 500px;
            font-size: 13px;
        }
        #world-text {
            position: absolute;
            top: 30px;
            left: 30px;
            background: rgba(0,0,0,0.6);
            padding: 12px 18px;
            border: 1px solid rgba(255,255,255,0.2);
            font-size: 11px;
            opacity: 0;
            transition: opacity 0.3s;
            font-family: 'Courier New', monospace;
            letter-spacing: 1px;
        }
        #center-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9);
            padding: 30px 50px;
            border: 2px solid rgba(255,255,255,0.4);
            text-align: center;
            opacity: 0;
            transition: opacity 0.8s;
            max-width: 70%;
            font-size: 16px;
            line-height: 1.6;
        }
        #glitch-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255,255,255,0.03);
            opacity: 0;
            pointer-events: none;
            mix-blend-mode: difference;
        }
        #helper-text {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.5);
            padding: 10px 15px;
            border-radius: 4px;
            font-size: 11px;
            opacity: 1;
            transition: opacity 0.5s;
        }
        .question-prompt {
            position: absolute;
            background: rgba(0,0,0,0.85);
            padding: 15px 25px;
            border: 1px solid rgba(255,255,255,0.3);
            font-size: 12px;
            opacity: 0;
            transition: opacity 0.5s;
            pointer-events: none;
        }
        @keyframes glitch {
            0%, 100% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
        }
        .glitching {
            animation: glitch 0.3s infinite;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="ui-overlay">
        <div id="helper-text">WASD to move • Mouse to look • [R] restart</div>
        <div id="intro-text"></div>
        <div id="path-hint"></div>
        <div id="world-text"></div>
        <div id="center-message"></div>
    </div>
    <div id="glitch-overlay"></div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.157.0/build/three.min.js"></script>
    <script>
        // ========== CONFIGURATION ==========
        const CONFIG = {
            AUDIO_ENABLED: false,
            MAX_PIXEL_RATIO: 1.5,
            CAMERA_FAR: 200,
            PUZZLE_PIECES_VOID: 60,
            PUZZLE_PIECES_LOGIC: 80,
            PUZZLE_PIECES_MEMORY: 50,
            PARTICLE_COUNT: 200,
            MOVE_SPEED: 4,
            LOOK_SENSITIVITY: 0.003,
            COLORS: {
                VOID_BG: 0x0a0a0f,
                LOGIC: 0x6db3ff,      // Cool silver-blue
                EMOTION: 0xff3355,    // Deep crimson
                MEMORY: 0xffaa44,     // Tarnished gold
                PUZZLE_BASE: 0x334455
            }
        };

        // ========== GLOBAL STATE ==========
        let scene, camera, renderer, clock;
        let state = 'VOID_CHOICE'; // VOID_CHOICE | TRANSITION | LOGIC | EMOTION | MEMORY | ENDING
        let chosenPath = null;
        let player = {
            position: new THREE.Vector3(0, 0, 0),
            velocity: new THREE.Vector3(),
            yaw: 0,
            pitch: 0
        };
        let keys = {};
        let mouseDown = false;

        // Scene objects
        let puzzlePieces = [];
        let particles = [];
        let zones = [];
        let zoneProgress = [0, 0, 0];
        let glitchIntensity = 0;
        let worldTime = 0;
        let textElements = [];

        // ========== PUZZLE PIECE ==========
        class PuzzlePiece {
            constructor(x, y, z, color, worldType = 'void') {
                const shapes = ['box', 'sphere', 'plane', 'torus'];
                this.worldType = worldType;
                this.type = shapes[Math.floor(Math.random() * shapes.length)];

                let geometry;
                const size = 0.2 + Math.random() * 0.4;

                if (this.type === 'box') {
                    geometry = new THREE.BoxGeometry(size, size, size);
                } else if (this.type === 'sphere') {
                    geometry = new THREE.SphereGeometry(size * 0.6, 8, 8);
                } else if (this.type === 'plane') {
                    geometry = new THREE.PlaneGeometry(size, size);
                } else {
                    geometry = new THREE.TorusGeometry(size * 0.5, size * 0.15, 8, 12);
                }

                const material = new THREE.MeshStandardMaterial({
                    color: color,
                    transparent: true,
                    opacity: 0.6,
                    emissive: color,
                    emissiveIntensity: 0.2,
                    wireframe: Math.random() < 0.3
                });

                this.mesh = new THREE.Mesh(geometry, material);
                this.mesh.position.set(x, y, z);

                this.velocity = new THREE.Vector3(
                    (Math.random() - 0.5) * 0.02,
                    (Math.random() - 0.5) * 0.02,
                    (Math.random() - 0.5) * 0.02
                );

                this.rotationSpeed = new THREE.Vector3(
                    (Math.random() - 0.5) * 0.5,
                    (Math.random() - 0.5) * 0.5,
                    (Math.random() - 0.5) * 0.5
                );

                this.targetPos = new THREE.Vector3(x, y, z);
                this.baseY = y;
                this.floatOffset = Math.random() * Math.PI * 2;
            }

            update(time, delta) {
                // Floating animation
                this.mesh.position.y = this.targetPos.y + Math.sin(time * 0.5 + this.floatOffset) * 0.3;

                // Rotation
                this.mesh.rotation.x += this.rotationSpeed.x * delta;
                this.mesh.rotation.y += this.rotationSpeed.y * delta;
                this.mesh.rotation.z += this.rotationSpeed.z * delta;

                // Drift
                if (this.worldType === 'void' || this.worldType === 'emotion') {
                    this.targetPos.add(this.velocity);

                    // Boundary check
                    if (Math.abs(this.targetPos.x) > 20) this.velocity.x *= -1;
                    if (Math.abs(this.targetPos.y) > 15) this.velocity.y *= -1;
                    if (Math.abs(this.targetPos.z) > 20) this.velocity.z *= -1;

                    this.mesh.position.x = this.targetPos.x;
                    this.mesh.position.z = this.targetPos.z;
                }
            }
        }

        // ========== PARTICLE ZONE ==========
        class ParticleZone {
            constructor(angle, color, name) {
                this.name = name;
                this.color = color;
                this.angle = angle;

                const distance = 12;
                this.position = new THREE.Vector3(
                    Math.sin(angle) * distance,
                    0,
                    Math.cos(angle) * distance
                );

                // Create particle system
                const geometry = new THREE.BufferGeometry();
                const positions = new Float32Array(CONFIG.PARTICLE_COUNT * 3);

                for (let i = 0; i < CONFIG.PARTICLE_COUNT; i++) {
                    const radius = 3;
                    const theta = Math.random() * Math.PI * 2;
                    const phi = Math.random() * Math.PI;

                    positions[i * 3] = this.position.x + Math.sin(phi) * Math.cos(theta) * radius;
                    positions[i * 3 + 1] = this.position.y + Math.sin(phi) * Math.sin(theta) * radius;
                    positions[i * 3 + 2] = this.position.z + Math.cos(phi) * radius;
                }

                geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

                const material = new THREE.PointsMaterial({
                    color: color,
                    size: 0.1,
                    transparent: true,
                    opacity: 0.4,
                    blending: THREE.AdditiveBlending
                });

                this.particles = new THREE.Points(geometry, material);
                this.baseOpacity = 0.4;
            }

            update(time, delta, isChosen, progress) {
                const positions = this.particles.geometry.attributes.position.array;

                for (let i = 0; i < CONFIG.PARTICLE_COUNT; i++) {
                    const idx = i * 3;

                    if (this.name === 'logic') {
                        // Organized, grid-like
                        const gridSnap = Math.sin(time * 0.5) * 0.02;
                        positions[idx + 1] += gridSnap;
                    } else if (this.name === 'emotion') {
                        // Chaotic, pulsing
                        const pulse = Math.sin(time * 3 + i * 0.1) * 0.05;
                        positions[idx] += pulse * (Math.random() - 0.5);
                        positions[idx + 1] += pulse * (Math.random() - 0.5);
                    } else if (this.name === 'memory') {
                        // Flickering, fading
                        if (Math.random() < 0.01) {
                            positions[idx + 1] += (Math.random() - 0.5) * 0.1;
                        }
                    }
                }

                this.particles.geometry.attributes.position.needsUpdate = true;

                // Intensity based on choice
                const targetOpacity = isChosen ? 0.8 : 0.4;
                const targetSize = isChosen ? 0.15 : 0.1;

                this.particles.material.opacity = THREE.MathUtils.lerp(
                    this.particles.material.opacity,
                    targetOpacity,
                    delta * 3
                );

                this.particles.material.size = THREE.MathUtils.lerp(
                    this.particles.material.size,
                    targetSize,
                    delta * 3
                );
            }
        }

        // ========== SCENE BUILDERS ==========
        function buildVoidScene() {
            clearScene();

            // Fog
            scene.fog = new THREE.Fog(CONFIG.COLORS.VOID_BG, 10, 50);

            // Create floating puzzle pieces
            for (let i = 0; i < CONFIG.PUZZLE_PIECES_VOID; i++) {
                const x = (Math.random() - 0.5) * 30;
                const y = (Math.random() - 0.5) * 20;
                const z = (Math.random() - 0.5) * 30;
                const color = new THREE.Color().setHSL(Math.random() * 0.1 + 0.55, 0.3, 0.4);

                const piece = new PuzzlePiece(x, y, z, color, 'void');
                scene.add(piece.mesh);
                puzzlePieces.push(piece);
            }

            // Create three colored zones
            const zoneDefs = [
                { angle: 0, color: CONFIG.COLORS.LOGIC, name: 'logic' },
                { angle: Math.PI * 2/3, color: CONFIG.COLORS.EMOTION, name: 'emotion' },
                { angle: Math.PI * 4/3, color: CONFIG.COLORS.MEMORY, name: 'memory' }
            ];

            zoneDefs.forEach(def => {
                const zone = new ParticleZone(def.angle, def.color, def.name);
                scene.add(zone.particles);
                zones.push(zone);
            });

            // Ambient lighting
            const ambientLight = new THREE.AmbientLight(0x404060, 0.5);
            scene.add(ambientLight);

            // Show intro text
            setTimeout(() => {
                const intro = document.getElementById('intro-text');
                intro.innerHTML = `You are inside a fragmented mindscape.<br>
                Three paths pulse in the distance.<br><br>
                <span style="color: #6db3ff;">■ Silver wire — Logic, precision, order</span><br>
                <span style="color: #ff3355;">■ Red thread — Emotion, chaos, warmth</span><br>
                <span style="color: #ffaa44;">■ Gold rope — Memory, nostalgia, fragments</span><br><br>
                Move toward one.`;
                intro.style.opacity = '1';

                setTimeout(() => {
                    intro.style.opacity = '0';
                }, 7000);
            }, 500);
        }

        function buildLogicWorld() {
            clearScene();

            scene.fog = new THREE.Fog(0x0d1520, 15, 60);

            // Grid floor
            const gridHelper = new THREE.GridHelper(60, 60, CONFIG.COLORS.LOGIC, CONFIG.COLORS.LOGIC);
            gridHelper.material.opacity = 0.2;
            gridHelper.material.transparent = true;
            scene.add(gridHelper);

            // Organized puzzle pieces
            const gridSize = 4;
            for (let i = 0; i < CONFIG.PUZZLE_PIECES_LOGIC; i++) {
                const gridX = ((i % gridSize) - gridSize / 2) * 2;
                const gridZ = (Math.floor(i / gridSize) - gridSize / 2) * 2;
                const y = Math.random() * 3;

                const piece = new PuzzlePiece(gridX, y, gridZ, CONFIG.COLORS.LOGIC, 'logic');
                scene.add(piece.mesh);
                puzzlePieces.push(piece);
            }

            // Cool lighting
            const ambientLight = new THREE.AmbientLight(0x4488aa, 0.4);
            const dirLight = new THREE.DirectionalLight(0x88ccff, 0.8);
            dirLight.position.set(5, 10, 5);
            scene.add(ambientLight, dirLight);

            // UI text
            setTimeout(() => {
                const worldText = document.getElementById('world-text');
                worldText.textContent = 'emotion: disabled | memory: archived';
                worldText.style.opacity = '1';
                worldText.style.color = '#6db3ff';

                setInterval(() => {
                    worldText.textContent = worldText.textContent === 'emotion: disabled | memory: archived'
                        ? 'logic: active | connection: stable'
                        : 'emotion: disabled | memory: archived';
                }, 3000);
            }, 500);
        }

        function buildEmotionWorld() {
            clearScene();

            scene.fog = new THREE.Fog(0x1a0505, 10, 40);

            // Chaotic puzzle pieces
            for (let i = 0; i < 50; i++) {
                const angle = (i / 50) * Math.PI * 2;
                const radius = 5 + Math.random() * 8;
                const x = Math.cos(angle) * radius;
                const z = Math.sin(angle) * radius;
                const y = Math.random() * 10 - 3;

                const hue = 0.95 + Math.random() * 0.1;
                const color = new THREE.Color().setHSL(hue, 0.8, 0.4 + Math.random() * 0.2);

                const piece = new PuzzlePiece(x, y, z, color, 'emotion');
                scene.add(piece.mesh);
                puzzlePieces.push(piece);
            }

            // Warm pulsing light
            const ambientLight = new THREE.AmbientLight(0x442020, 0.5);
            const pointLight = new THREE.PointLight(CONFIG.COLORS.EMOTION, 2, 20);
            pointLight.position.set(0, 2, 0);
            scene.add(ambientLight, pointLight);

            // Pulsing particles
            const particleGeo = new THREE.BufferGeometry();
            const particlePositions = new Float32Array(CONFIG.PARTICLE_COUNT * 3);
            for (let i = 0; i < CONFIG.PARTICLE_COUNT; i++) {
                particlePositions[i * 3] = (Math.random() - 0.5) * 30;
                particlePositions[i * 3 + 1] = Math.random() * 15;
                particlePositions[i * 3 + 2] = (Math.random() - 0.5) * 30;
            }
            particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
            const particleMat = new THREE.PointsMaterial({
                color: CONFIG.COLORS.EMOTION,
                size: 0.15,
                transparent: true,
                opacity: 0.6,
                blending: THREE.AdditiveBlending
            });
            const particleSystem = new THREE.Points(particleGeo, particleMat);
            scene.add(particleSystem);
            particles.push(particleSystem);

            // Text
            setTimeout(() => {
                const worldText = document.getElementById('world-text');
                worldText.textContent = 'You felt this once. Remember?';
                worldText.style.opacity = '1';
                worldText.style.color = '#ff3355';
                worldText.classList.add('glitching');
            }, 500);
        }

        function buildMemoryWorld() {
            clearScene();

            scene.fog = new THREE.Fog(0x0f0a05, 10, 50);

            // Scattered, incomplete puzzle pieces
            for (let i = 0; i < CONFIG.PUZZLE_PIECES_MEMORY; i++) {
                const x = (Math.random() - 0.5) * 25;
                const y = Math.random() * 8;
                const z = (Math.random() - 0.5) * 25;

                const isMissing = Math.random() < 0.3;
                const color = new THREE.Color().setHSL(0.08, 0.5, isMissing ? 0.2 : 0.4);

                const piece = new PuzzlePiece(x, y, z, color, 'memory');
                if (isMissing) {
                    piece.mesh.material.opacity = 0.2;
                    piece.mesh.material.wireframe = true;
                }
                scene.add(piece.mesh);
                puzzlePieces.push(piece);
            }

            // Warm nostalgic lighting
            const ambientLight = new THREE.AmbientLight(0x443322, 0.4);
            const dirLight = new THREE.DirectionalLight(0xffbb66, 0.6);
            dirLight.position.set(-3, 5, 4);
            scene.add(ambientLight, dirLight);

            // Floating question prompts
            const questions = [
                "Would you like to delete this memory?",
                "You are about to connect emotionally. Continue?",
                "Are you still you?"
            ];

            questions.forEach((q, idx) => {
                setTimeout(() => {
                    showFloatingText(q,
                        30 + idx * 25,
                        40 + Math.random() * 20,
                        'rgba(255, 170, 68, 0.8)');
                }, 1000 + idx * 2000);
            });

            // Text
            setTimeout(() => {
                const worldText = document.getElementById('world-text');
                worldText.textContent = 'memory_fragment_0' + Math.floor(Math.random() * 9) + '.dat';
                worldText.style.opacity = '1';
                worldText.style.color = '#ffaa44';
            }, 500);
        }

        function clearScene() {
            puzzlePieces.forEach(p => scene.remove(p.mesh));
            zones.forEach(z => scene.remove(z.particles));
            particles.forEach(p => scene.remove(p));
            textElements.forEach(t => t.remove());

            // Remove all lights
            const lights = scene.children.filter(c => c.isLight);
            lights.forEach(l => scene.remove(l));

            // Remove grid
            const grids = scene.children.filter(c => c.type === 'GridHelper');
            grids.forEach(g => scene.remove(g));

            puzzlePieces = [];
            zones = [];
            particles = [];
            textElements = [];
            zoneProgress = [0, 0, 0];
            worldTime = 0;

            scene.fog = null;

            document.getElementById('world-text').style.opacity = '0';
            document.getElementById('world-text').classList.remove('glitching');
            document.getElementById('center-message').style.opacity = '0';
            document.getElementById('path-hint').style.opacity = '0';
        }

        function showFloatingText(text, topPercent, leftPercent, color) {
            const div = document.createElement('div');
            div.className = 'question-prompt';
            div.textContent = text;
            div.style.top = topPercent + '%';
            div.style.left = leftPercent + '%';
            div.style.borderColor = color;
            div.style.color = color;
            document.getElementById('ui-overlay').appendChild(div);
            textElements.push(div);

            setTimeout(() => {
                div.style.opacity = '1';
            }, 100);

            setTimeout(() => {
                div.style.opacity = '0';
            }, 4000);
        }

        // ========== INPUT HANDLING ==========
        function setupInput() {
            window.addEventListener('keydown', e => {
                keys[e.key.toLowerCase()] = true;
                if (e.key.toLowerCase() === 'r') reset();
            });
            window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

            window.addEventListener('mousedown', e => {
                if (e.button === 0) mouseDown = true;
            });
            window.addEventListener('mouseup', () => mouseDown = false);
            window.addEventListener('mousemove', e => {
                if (mouseDown) {
                    player.yaw -= e.movementX * CONFIG.LOOK_SENSITIVITY;
                    player.pitch -= e.movementY * CONFIG.LOOK_SENSITIVITY;
                    player.pitch = Math.max(-Math.PI / 2.5, Math.min(Math.PI / 2.5, player.pitch));
                }
            });

            setTimeout(() => {
                document.getElementById('helper-text').style.opacity = '0';
            }, 8000);
        }

        function handleMovement(delta) {
            const moveVector = new THREE.Vector3();

            if (keys['w']) moveVector.z -= 1;
            if (keys['s']) moveVector.z += 1;
            if (keys['a']) moveVector.x -= 1;
            if (keys['d']) moveVector.x += 1;

            if (moveVector.length() > 0) {
                moveVector.normalize();

                const cos = Math.cos(player.yaw);
                const sin = Math.sin(player.yaw);
                const rotatedX = moveVector.x * cos - moveVector.z * sin;
                const rotatedZ = moveVector.x * sin + moveVector.z * cos;

                player.velocity.x = rotatedX * CONFIG.MOVE_SPEED;
                player.velocity.z = rotatedZ * CONFIG.MOVE_SPEED;
            } else {
                player.velocity.x *= 0.85;
                player.velocity.z *= 0.85;
            }

            player.position.x += player.velocity.x * delta;
            player.position.z += player.velocity.z * delta;

            camera.position.copy(player.position);
            camera.rotation.order = 'YXZ';
            camera.rotation.y = player.yaw;
            camera.rotation.x = player.pitch;
        }

        // ========== UPDATE FUNCTIONS ==========
        function updateVoidChoice(time, delta) {
            puzzlePieces.forEach(p => p.update(time, delta));

            // Check distance to zones
            let closestDist = Infinity;
            let closestIdx = -1;

            zones.forEach((zone, idx) => {
                const dist = player.position.distanceTo(zone.position);

                if (dist < closestDist) {
                    closestDist = dist;
                    closestIdx = idx;
                }

                if (dist < 8) {
                    zoneProgress[idx] = Math.min(1, zoneProgress[idx] + delta * 0.3);
                } else {
                    zoneProgress[idx] = Math.max(0, zoneProgress[idx] - delta * 0.2);
                }

                const isChosen = idx === closestIdx && closestDist < 8;
                zone.update(time, delta, isChosen, zoneProgress[idx]);
            });

            // Show hint
            if (closestDist < 8 && closestIdx >= 0) {
                const zone = zones[closestIdx];
                const hint = document.getElementById('path-hint');

                const hints = {
                    logic: "The silver wire. Everything can be organized. Let's make it clean.",
                    emotion: "The red thread. Feel it all. Let it overflow. You're alive here.",
                    memory: "The gold rope. Piece together what remains. What do you want to remember?"
                };

                hint.textContent = hints[zone.name];
                hint.style.opacity = Math.min(zoneProgress[closestIdx], 0.9);
                hint.style.borderColor = `#${zone.color.toString(16).padStart(6, '0')}`;

                // Transition when committed
                if (zoneProgress[closestIdx] >= 1.0) {
                    state = 'TRANSITION';
                    chosenPath = zone.name;
                    hint.style.opacity = '0';
                }
            } else {
                document.getElementById('path-hint').style.opacity = '0';
            }
        }

        function updateTransition(time, delta) {
            // Glitch effect
            glitchIntensity = Math.min(1, glitchIntensity + delta * 2);
            document.getElementById('glitch-overlay').style.opacity = glitchIntensity * 0.3;

            // Fade and build new world
            puzzlePieces.forEach(p => {
                p.mesh.material.opacity *= 0.95;
            });

            zones.forEach(z => {
                z.particles.material.opacity *= 0.95;
            });

            if (glitchIntensity >= 1) {
                if (chosenPath === 'logic') buildLogicWorld();
                else if (chosenPath === 'emotion') buildEmotionWorld();
                else if (chosenPath === 'memory') buildMemoryWorld();

                state = chosenPath.toUpperCase();
                glitchIntensity = 0;
                document.getElementById('glitch-overlay').style.opacity = '0';
            }
        }

        function updateLogicWorld(time, delta) {
            worldTime += delta;

            puzzlePieces.forEach((p, idx) => {
                p.update(time, delta);

                // Pieces slowly align to grid
                const gridX = Math.round(p.mesh.position.x / 2) * 2;
                const gridZ = Math.round(p.mesh.position.z / 2) * 2;

                p.mesh.position.x = THREE.MathUtils.lerp(p.mesh.position.x, gridX, delta * 0.3);
                p.mesh.position.z = THREE.MathUtils.lerp(p.mesh.position.z, gridZ, delta * 0.3);

                // Fade colors to grey
                const currentColor = p.mesh.material.color;
                const greyness = 0.5 + worldTime * 0.02;
                const targetColor = new THREE.Color(greyness, greyness, greyness);
                currentColor.lerp(targetColor, delta * 0.1);
            });

            // Show ending after 30s
            if (worldTime > 30) {
                const msg = document.getElementById('center-message');
                msg.innerHTML = 'Stability achieved.<br><br>Feeling: <span style="opacity: 0.3">none</span>';
                msg.style.opacity = '1';
                msg.style.borderColor = '#6db3ff';
            }
        }

        function updateEmotionWorld(time, delta) {
            worldTime += delta;

            // Chaotic movement
            puzzlePieces.forEach(p => {
                p.update(time, delta);

                // Pulsing intensity
                const pulse = Math.sin(time * 2 + p.floatOffset) * 0.5 + 0.5;
                p.mesh.material.emissiveIntensity = pulse * 0.8;
                p.velocity.multiplyScalar(1 + pulse * 0.1);
            });

            // Particle pulsing
            particles.forEach(p => {
                const pulse = Math.sin(time * 3) * 0.3 + 0.7;
                p.material.size = 0.15 * pulse;
            });

            // Glitch occasionally
            if (Math.random() < 0.01) {
                document.getElementById('glitch-overlay').style.opacity = Math.random() * 0.5;
                setTimeout(() => {
                    document.getElementById('glitch-overlay').style.opacity = '0';
                }, 100);
            }

            if (worldTime > 25) {
                const msg = document.getElementById('center-message');
                msg.innerHTML = 'Too much. Too bright. Too alive.<br><br>Can you feel it?<br>Or is it too much to hold?';
                msg.style.opacity = Math.sin(time * 2) * 0.3 + 0.7;
                msg.style.borderColor = '#ff3355';
            }
        }

        function updateMemoryWorld(time, delta) {
            worldTime += delta;

            puzzlePieces.forEach(p => {
                p.update(time, delta);

                // Random flickering
                if (Math.random() < 0.02) {
                    p.mesh.material.opacity = Math.random() * 0.6 + 0.2;
                }

                // Some pieces fade away
                if (worldTime > 15 && Math.random() < 0.001) {
                    p.mesh.material.opacity *= 0.98;
                }
            });

            if (worldTime > 20) {
                const msg = document.getElementById('center-message');
                msg.innerHTML = 'Some pieces are missing.<br>Some gaps hum softly.<br><br>Are you still you?';
                msg.style.opacity = Math.random() < 0.1 ? 0 : 0.8;
                msg.style.borderColor = '#ffaa44';
            }
        }

        // ========== MAIN LOOP ==========
        function animate() {
            requestAnimationFrame(animate);

            const delta = Math.min(clock.getDelta(), 0.1);
            const time = clock.getElapsedTime();

            handleMovement(delta);

            if (state === 'VOID_CHOICE') {
                updateVoidChoice(time, delta);
            } else if (state === 'TRANSITION') {
                updateTransition(time, delta);
            } else if (state === 'LOGIC') {
                updateLogicWorld(time, delta);
            } else if (state === 'EMOTION') {
                updateEmotionWorld(time, delta);
            } else if (state === 'MEMORY') {
                updateMemoryWorld(time, delta);
            }

            renderer.render(scene, camera);
        }

        // ========== RESET ==========
        function reset() {
            state = 'VOID_CHOICE';
            chosenPath = null;
            player.position.set(0, 0, 0);
            player.velocity.set(0, 0, 0);
            player.yaw = 0;
            player.pitch = 0;
            glitchIntensity = 0;

            buildVoidScene();

            document.getElementById('helper-text').style.opacity = '1';
            setTimeout(() => {
                document.getElementById('helper-text').style.opacity = '0';
            }, 8000);
        }

        // ========== INITIALIZATION ==========
        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(CONFIG.COLORS.VOID_BG);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, CONFIG.CAMERA_FAR);
            camera.position.copy(player.position);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, CONFIG.MAX_PIXEL_RATIO));
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            clock = new THREE.Clock();

            setupInput();
            buildVoidScene();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            animate();
        }

        init();
    </script>
</body>
</html>
