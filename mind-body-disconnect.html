<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mind/Body Disconnect — The Three Strings (Enhanced Visual Clarity)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            font-family: 'Courier New', monospace;
            background: #000;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        #ui-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            color: #fff;
            font-size: 12px;
        }
        #helper-text {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.5);
            padding: 10px;
            border-radius: 4px;
            transition: opacity 0.5s;
        }
        #world-text {
            position: absolute;
            top: 60px;
            left: 20px;
            background: rgba(0,0,0,0.5);
            padding: 8px;
            border-radius: 4px;
            font-size: 11px;
            opacity: 0;
            transition: opacity 0.3s;
        }
        #progress-ring {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 60px;
        }
        #center-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.7);
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            opacity: 0;
            transition: opacity 0.5s;
            max-width: 80%;
        }
        #intro-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8);
            padding: 30px;
            border-radius: 8px;
            text-align: center;
            opacity: 0;
            transition: opacity 1s;
            max-width: 500px;
            font-size: 16px;
            line-height: 1.6;
            pointer-events: none;
        }
        #white-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s;
        }
        #mobile-controls {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 200px;
            pointer-events: auto;
            display: none;
        }
        .joystick {
            position: absolute;
            width: 120px;
            height: 120px;
            bottom: 40px;
            left: 40px;
            background: rgba(255,255,255,0.1);
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
        }
        .joystick-stick {
            position: absolute;
            width: 40px;
            height: 40px;
            background: rgba(255,255,255,0.4);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        .look-area {
            position: fixed;
            right: 0;
            top: 0;
            width: 50%;
            height: 100%;
            background: rgba(255,255,255,0.02);
            pointer-events: auto;
        }
        @media (max-width: 768px) {
            #mobile-controls {
                display: block;
            }
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="white-overlay"></div>
    <div id="ui-overlay">
        <div id="helper-text">WASD / arrows to move • Right-drag to look • [R] restart</div>
        <div id="intro-text">Three strings are tied to you. Each leads somewhere different.<br>Move toward one — and see where it takes you.</div>
        <div id="world-text"></div>
        <canvas id="progress-ring" width="60" height="60"></canvas>
        <div id="center-text"></div>
    </div>
    <div id="mobile-controls">
        <div class="joystick">
            <div class="joystick-stick"></div>
        </div>
        <div class="look-area"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.157.0/build/three.min.js"></script>
    <script>
        // ========== CONFIGURATION ==========
        const CONFIG = {
            AUDIO_ENABLED: false,
            MAX_PIXEL_RATIO: 1.25,
            CAMERA_FAR: 200,
            PARTICLE_COUNT_VOID: 100,
            PARTICLE_COUNT_EMOTION: 120,
            PUZZLE_PIECES_LOGIC: 50,
            PUZZLE_PIECES_MEMORY: 40,
            MELT_PLANES_COUNT: 8,
            TRANSITION_PARTICLES: 50,
            STRING_SEGMENTS: 30,
            CHOICE_PROGRESS_SPEED: 0.5,
            MOVE_SPEED: 5,
            LOOK_SENSITIVITY: 0.002,
            PERFORMANCE_CHECK_INTERVAL: 60,
            COLORS: {
                VOID_SKY: 0x000000,
                HAND_SKIN: 0xf5e9da,
                HAND_EMISSIVE: 0xf6dcbf,
                LOGIC_STRING: 0xAEE9FF,      // Bright cyan silver
                EMOTION_STRING: 0xFF4A66,    // Vivid crimson pink
                MEMORY_STRING: 0xFFD279,     // Warm gold
            }
        };

        // ========== GLOBAL STATE ==========
        let scene, camera, renderer, clock;
        let state = 'VOID_CHOICE'; // VOID_CHOICE | TRANSITION | LOGIC | EMOTION | MEMORY
        let chosenPath = null;
        let player = {
            position: new THREE.Vector3(0, 1.6, 5),
            velocity: new THREE.Vector3(),
            yaw: 0,
            pitch: 0
        };
        let keys = {};
        let mouseDown = false;
        let mobile = /Android|webOS|iPhone|iPad|iPod/i.test(navigator.userAgent);

        // Input state
        let joystickActive = false;
        let joystickDelta = { x: 0, y: 0 };
        let touchLookDelta = { x: 0, y: 0 };
        let firstInput = false;

        // Scene objects
        let strings = [];
        let hand = null;
        let particleFields = [];
        let puzzlePieces = [];
        let meltPlanes = [];
        let lightRig = null;
        let audioLite = null;

        // Progress tracking
        let stringProgress = [0, 0, 0];
        let transitionTime = 0;
        let cameraShake = { x: 0, y: 0 };
        let snapAnimProgress = 0;

        // Performance
        let frameCount = 0;
        let deltaSum = 0;
        let performanceMode = 'normal';

        // ========== AUDIO LITE ==========
        class AudioLite {
            constructor() {
                this.ctx = null;
                this.gainNodes = {};
                this.oscillators = {};
                this.currentWorld = 'void';
                this.enabled = CONFIG.AUDIO_ENABLED;
            }

            init() {
                if (!this.enabled) return;
                try {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                    this.gainNodes.master = this.ctx.createGain();
                    this.gainNodes.master.connect(this.ctx.destination);
                    this.gainNodes.master.gain.value = 0.3;
                } catch (e) {
                    console.warn('Audio not available');
                    this.enabled = false;
                }
            }

            playSnap() {
                if (!this.enabled || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain);
                gain.connect(this.gainNodes.master);
                osc.frequency.value = 200;
                gain.gain.value = 0.2;
                osc.start();
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
                osc.stop(this.ctx.currentTime + 0.1);
            }

            setWorld(worldName) {
                if (!this.enabled || !this.ctx) return;
                this.currentWorld = worldName;
                // Simple gain ramping for world transitions
                Object.keys(this.gainNodes).forEach(key => {
                    if (key !== 'master' && this.gainNodes[key]) {
                        this.gainNodes[key].gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.5);
                    }
                });
            }
        }

        // ========== LIGHT RIG ==========
        class LightRig {
            constructor(scene) {
                this.scene = scene;
                this.lights = [];
            }

            setWorld(worldName) {
                // Clear existing lights
                this.lights.forEach(light => this.scene.remove(light));
                this.lights = [];

                if (worldName === 'logic') {
                    const hemi = new THREE.HemisphereLight(0x9bbcff, 0x0b0d12, 0.6);
                    const dir = new THREE.DirectionalLight(0xffffff, 0.6);
                    dir.position.set(4, 5, 2);
                    this.lights.push(hemi, dir);
                } else if (worldName === 'emotion') {
                    const hemi = new THREE.HemisphereLight(0xffa0a0, 0x1a0a0a, 0.5);
                    const point = new THREE.PointLight(0xff6060, 0.3, 20);
                    this.pulseLight = point;
                    this.lights.push(hemi, point);
                } else if (worldName === 'memory') {
                    const hemi = new THREE.HemisphereLight(0xffe2a0, 0x0b0a06, 0.45);
                    const dir = new THREE.DirectionalLight(0xffd89a, 0.4);
                    dir.position.set(-2, 4, 3);
                    this.lights.push(hemi, dir);
                } else {
                    // Void - enhanced lighting for visibility
                    const ambient = new THREE.AmbientLight(0x222222, 0.4);
                    const dir = new THREE.DirectionalLight(0xffffff, 1.0);
                    dir.position.set(5, 10, 5);
                    const handLight = new THREE.PointLight(0xffddaa, 1.5, 10);
                    handLight.position.set(0, 1.4, 2.5);
                    this.handLight = handLight;
                    this.lights.push(ambient, dir, handLight);
                }

                this.lights.forEach(light => this.scene.add(light));
            }

            update(time, delta) {
                if (this.pulseLight) {
                    this.pulseLight.intensity = 0.3 + Math.sin(time * 2) * 0.15;
                    this.pulseLight.position.copy(player.position).add(new THREE.Vector3(0, 0.5, 2));
                }
            }
        }

        // ========== STRING PATH ==========
        class StringPath {
            constructor(color, angle, name) {
                this.name = name;
                this.color = color;
                this.angle = angle;
                this.progress = 0;
                this.baseRadius = 0.05;
                this.group = new THREE.Group();

                // Create curve from wrist to distance
                const points = [];
                const wristPos = new THREE.Vector3(0, 1.4, 2.5); // Near hand position
                const direction = new THREE.Vector3(
                    Math.sin(angle),
                    -0.1, // Slight downward curve
                    Math.cos(angle)
                );

                for (let i = 0; i < 12; i++) {
                    const dist = i * 1.2;
                    const point = direction.clone().multiplyScalar(dist).add(wristPos);
                    // Add slight wave
                    if (name === 'emotion') {
                        point.x += Math.sin(i * 0.5) * 0.15;
                    }
                    points.push(point);
                }

                const curve = new THREE.CatmullRomCurve3(points);
                const geometry = new THREE.TubeGeometry(curve, CONFIG.STRING_SEGMENTS, this.baseRadius, 8, false);

                // Main string material - bright and glowing
                const material = new THREE.MeshStandardMaterial({
                    color: color,
                    metalness: name === 'logic' ? 0.8 : name === 'emotion' ? 0.2 : 0.4,
                    roughness: name === 'logic' ? 0.3 : name === 'emotion' ? 0.6 : 0.7,
                    emissive: color,
                    emissiveIntensity: 1.5
                });

                this.mesh = new THREE.Mesh(geometry, material);
                this.group.add(this.mesh);

                // Halo glow - slightly larger transparent tube
                const haloGeometry = new THREE.TubeGeometry(curve, CONFIG.STRING_SEGMENTS, this.baseRadius * 2.5, 8, false);
                const haloMaterial = new THREE.MeshBasicMaterial({
                    color: color,
                    transparent: true,
                    opacity: 0.25,
                    blending: THREE.AdditiveBlending
                });
                this.halo = new THREE.Mesh(haloGeometry, haloMaterial);
                this.group.add(this.halo);

                this.direction = direction.normalize();
                this.pulseClock = Math.random() * Math.PI * 2;
            }

            update(time, delta, isChosen, isFading) {
                let baseIntensity = 1.5;

                // Pulse effect for logic
                if (this.name === 'logic') {
                    this.pulseClock += delta * 1.5;
                    baseIntensity += Math.sin(this.pulseClock) * 0.3;
                }

                // Uneven pulse for emotion
                if (this.name === 'emotion') {
                    baseIntensity += Math.sin(time * 3.5) * 0.4 + Math.sin(time * 7) * 0.2;
                    this.mesh.rotation.z = Math.sin(time * 2 + this.angle) * 0.08;
                }

                // Flicker for memory
                if (this.name === 'memory') {
                    if (Math.random() < 0.03) {
                        baseIntensity *= (0.7 + Math.random() * 0.6);
                    }
                }

                // Scale and brightness based on choice
                const targetIntensity = isChosen ? 3.0 : (isFading ? 0.3 : baseIntensity);
                this.mesh.material.emissiveIntensity = THREE.MathUtils.lerp(
                    this.mesh.material.emissiveIntensity,
                    targetIntensity,
                    delta * 4
                );

                const targetHaloOpacity = isChosen ? 0.5 : (isFading ? 0.1 : 0.25);
                this.halo.material.opacity = THREE.MathUtils.lerp(
                    this.halo.material.opacity,
                    targetHaloOpacity,
                    delta * 4
                );
            }
        }

        // ========== PARTICLE FIELD ==========
        class ParticleField {
            constructor(count, size = 2, color = 0xffffff, alpha = 0.08) {
                this.count = count;
                const geometry = new THREE.BufferGeometry();
                const positions = new Float32Array(count * 3);

                for (let i = 0; i < count; i++) {
                    positions[i * 3] = (Math.random() - 0.5) * 40;
                    positions[i * 3 + 1] = Math.random() * 20;
                    positions[i * 3 + 2] = (Math.random() - 0.5) * 40;
                }

                geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

                const material = new THREE.PointsMaterial({
                    size: size,
                    color: color,
                    transparent: true,
                    opacity: alpha,
                    sizeAttenuation: true
                });

                this.points = new THREE.Points(geometry, material);
                this.baseSize = size;
                this.heartbeat = 0;
            }

            update(time, delta, worldName) {
                if (worldName === 'emotion') {
                    this.heartbeat += delta * 2;
                    const scale = 1 + Math.sin(this.heartbeat) * 0.15;
                    this.points.material.size = this.baseSize * scale;
                }
            }
        }

        // ========== PUZZLE PIECE ==========
        class PuzzlePiece {
            constructor(type = 'box', worldName = 'logic') {
                this.worldName = worldName;
                this.type = type;

                if (worldName === 'logic') {
                    const size = 0.3 + Math.random() * 0.3;
                    this.mesh = new THREE.Mesh(
                        new THREE.BoxGeometry(size, size, size),
                        new THREE.MeshStandardMaterial({
                            color: new THREE.Color().setHSL(0.6, 0.3, 0.5 + Math.random() * 0.2),
                            metalness: 0.7,
                            roughness: 0.3
                        })
                    );
                    this.targetPos = new THREE.Vector3(
                        (Math.random() - 0.5) * 15,
                        0.5,
                        (Math.random() - 0.5) * 15
                    );
                } else if (worldName === 'memory') {
                    const canvas = document.createElement('canvas');
                    canvas.width = 64;
                    canvas.height = 64;
                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = '#d4b896';
                    ctx.fillRect(0, 0, 64, 64);
                    // Add noise
                    for (let i = 0; i < 200; i++) {
                        ctx.fillStyle = `rgba(${100 + Math.random() * 50},${80 + Math.random() * 40},30,${Math.random() * 0.3})`;
                        ctx.fillRect(Math.random() * 64, Math.random() * 64, 2, 2);
                    }

                    const texture = new THREE.CanvasTexture(canvas);
                    this.mesh = new THREE.Mesh(
                        new THREE.PlaneGeometry(2, 2),
                        new THREE.MeshStandardMaterial({
                            map: texture,
                            transparent: true,
                            opacity: 0.8,
                            side: THREE.DoubleSide
                        })
                    );
                    this.targetPos = new THREE.Vector3(
                        (Math.random() - 0.5) * 20,
                        2 + Math.random() * 3,
                        (Math.random() - 0.5) * 20
                    );
                    this.floatSpeed = 0.3 + Math.random() * 0.4;
                    this.floatOffset = Math.random() * Math.PI * 2;
                    this.missing = Math.random() < 0.3;
                }

                this.mesh.position.copy(this.targetPos);
                this.snapProgress = 0;
                this.snapped = false;
            }

            update(time, delta, playerPos) {
                if (this.worldName === 'logic' && !this.snapped) {
                    const dist = this.mesh.position.distanceTo(playerPos);
                    if (dist < 8) {
                        this.snapProgress += delta * 0.5;
                        if (this.snapProgress >= 1) {
                            this.snapped = true;
                            this.snapProgress = 1;
                        }
                    }

                    // Lerp to grid position near player
                    if (this.snapProgress > 0) {
                        const gridPos = new THREE.Vector3(
                            Math.round(playerPos.x / 2) * 2 + (this.targetPos.x % 2),
                            0.3,
                            Math.round(playerPos.z / 2) * 2 + (this.targetPos.z % 2)
                        );
                        this.mesh.position.lerp(gridPos, delta * this.snapProgress * 2);
                    }
                } else if (this.worldName === 'memory') {
                    // Float animation
                    const floatY = Math.sin(time * this.floatSpeed + this.floatOffset) * 0.3;
                    this.mesh.position.y = this.targetPos.y + floatY;
                    this.mesh.rotation.y += delta * 0.2;

                    if (this.missing && Math.random() < 0.001) {
                        this.mesh.material.opacity *= 0.98;
                    }
                }
            }
        }

        // ========== HAND CREATOR ==========
        function createHand() {
            const handGroup = new THREE.Group();

            // Palm - slightly curved box/sphere
            const palm = new THREE.Mesh(
                new THREE.SphereGeometry(0.12, 16, 16),
                new THREE.MeshPhysicalMaterial({
                    color: CONFIG.COLORS.HAND_SKIN,
                    transparent: true,
                    opacity: 0.85,
                    roughness: 0.4,
                    metalness: 0.1,
                    emissive: CONFIG.COLORS.HAND_EMISSIVE,
                    emissiveIntensity: 0.4
                })
            );
            palm.scale.set(1, 0.7, 1.2);
            handGroup.add(palm);

            // Five fingers (simplified as tapered cylinders)
            const fingerPositions = [
                { x: -0.12, y: 0, z: 0.08, length: 0.15, angle: -0.3 },  // Pinky
                { x: -0.06, y: 0, z: 0.12, length: 0.18, angle: -0.1 },  // Ring
                { x: 0, y: 0, z: 0.13, length: 0.2, angle: 0 },          // Middle
                { x: 0.06, y: 0, z: 0.12, length: 0.18, angle: 0.1 },     // Index
                { x: 0.12, y: -0.02, z: 0.02, length: 0.14, angle: 0.8 } // Thumb
            ];

            fingerPositions.forEach((fp, idx) => {
                const finger = new THREE.Group();

                // 3 segments per finger
                for (let seg = 0; seg < 3; seg++) {
                    const segLength = fp.length / 3;
                    const segRadius = 0.015 - seg * 0.003;
                    const segment = new THREE.Mesh(
                        new THREE.CylinderGeometry(segRadius, segRadius * 0.9, segLength, 8),
                        palm.material.clone()
                    );
                    segment.position.set(0, seg * segLength * 0.9, 0);
                    segment.rotation.z = Math.PI / 2;
                    finger.add(segment);
                }

                finger.position.set(fp.x, fp.y, fp.z);
                finger.rotation.y = fp.angle;
                finger.userData.baseRotation = fp.angle;
                finger.userData.curveAmount = idx === 4 ? 0.3 : 0.15; // Thumb curves more
                handGroup.add(finger);
            });

            // Position hand in front of camera
            handGroup.position.set(0, 1.4, 2.5);
            handGroup.rotation.x = -0.2;
            handGroup.userData.baseY = 1.4;

            return handGroup;
        }

        // ========== SCENE BUILDERS ==========
        function buildVoidScene() {
            clearScene();

            // Black fog for atmosphere
            scene.fog = new THREE.FogExp2(0x000000, 0.05);

            // Sky box
            const skyGeo = new THREE.BoxGeometry(200, 200, 200);
            const skyMat = new THREE.MeshBasicMaterial({
                color: CONFIG.COLORS.VOID_SKY,
                side: THREE.BackSide
            });
            const sky = new THREE.Mesh(skyGeo, skyMat);
            scene.add(sky);

            // Particle dust
            const particles = new ParticleField(CONFIG.PARTICLE_COUNT_VOID, 1.5, 0xffffff, 0.06);
            scene.add(particles.points);
            particleFields.push(particles);

            // Create the 3D hand
            hand = createHand();
            scene.add(hand);

            // Three bright strings attached to wrist
            const stringDefs = [
                { angle: 0, color: CONFIG.COLORS.LOGIC_STRING, name: 'logic' },
                { angle: Math.PI * 2/3, color: CONFIG.COLORS.EMOTION_STRING, name: 'emotion' },
                { angle: Math.PI * 4/3, color: CONFIG.COLORS.MEMORY_STRING, name: 'memory' }
            ];

            stringDefs.forEach(def => {
                const string = new StringPath(def.color, def.angle, def.name);
                scene.add(string.group);
                strings.push(string);
            });

            lightRig.setWorld('void');

            // Show intro text after first input
            setTimeout(() => {
                if (!firstInput) {
                    document.getElementById('intro-text').style.opacity = '1';
                    setTimeout(() => {
                        document.getElementById('intro-text').style.opacity = '0';
                    }, 5000);
                }
            }, 500);
        }

        function buildLogicWorld() {
            clearScene();

            // Floor with grid
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#0a0c10';
            ctx.fillRect(0, 0, 256, 256);
            ctx.strokeStyle = '#1a2a44';
            ctx.lineWidth = 1;
            for (let i = 0; i <= 16; i++) {
                const pos = i * 16;
                ctx.beginPath();
                ctx.moveTo(pos, 0);
                ctx.lineTo(pos, 256);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, pos);
                ctx.lineTo(256, 0);
                ctx.stroke();
            }

            const floorTex = new THREE.CanvasTexture(canvas);
            floorTex.wrapS = floorTex.wrapT = THREE.RepeatWrapping;
            floorTex.repeat.set(20, 20);

            const floor = new THREE.Mesh(
                new THREE.PlaneGeometry(200, 200),
                new THREE.MeshStandardMaterial({ map: floorTex })
            );
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            // Puzzle pieces
            for (let i = 0; i < CONFIG.PUZZLE_PIECES_LOGIC; i++) {
                const piece = new PuzzlePiece('box', 'logic');
                scene.add(piece.mesh);
                puzzlePieces.push(piece);
            }

            lightRig.setWorld('logic');

            // UI text
            setTimeout(() => {
                const worldText = document.getElementById('world-text');
                worldText.style.opacity = '1';
                worldText.textContent = 'emotion: disabled | memory: archived';
                setInterval(() => {
                    worldText.textContent = worldText.textContent === 'emotion: disabled | memory: archived'
                        ? 'logic: active | connection: stable'
                        : 'emotion: disabled | memory: archived';
                }, 3000);
            }, 500);
        }

        function buildEmotionWorld() {
            clearScene();

            // Fog
            scene.fog = new THREE.Fog(0x24060b, 20, 60);

            // Melt planes
            for (let i = 0; i < CONFIG.MELT_PLANES_COUNT; i++) {
                const geo = new THREE.PlaneGeometry(20, 10, 16, 8);
                const mat = new THREE.MeshStandardMaterial({
                    color: new THREE.Color().setHSL(0, 0.7, 0.3 + Math.random() * 0.2),
                    emissive: CONFIG.COLORS.EMOTION_STRING,
                    emissiveIntensity: 0.1,
                    side: THREE.DoubleSide,
                    transparent: true,
                    opacity: 0.6
                });

                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.set(
                    (Math.random() - 0.5) * 40,
                    2 + Math.random() * 3,
                    (Math.random() - 0.5) * 40
                );
                mesh.rotation.y = Math.random() * Math.PI;
                mesh.userData.phaseOffset = Math.random() * Math.PI * 2;
                mesh.userData.originalPositions = [];

                const positions = geo.attributes.position;
                for (let j = 0; j < positions.count; j++) {
                    mesh.userData.originalPositions.push({
                        x: positions.getX(j),
                        y: positions.getY(j),
                        z: positions.getZ(j)
                    });
                }

                scene.add(mesh);
                meltPlanes.push(mesh);
            }

            // Particles
            const particles = new ParticleField(CONFIG.PARTICLE_COUNT_EMOTION, 3, CONFIG.COLORS.EMOTION_STRING, 0.3);
            scene.add(particles.points);
            particleFields.push(particles);

            lightRig.setWorld('emotion');
        }

        function buildMemoryWorld() {
            clearScene();

            // Puzzle pieces as memory fragments
            for (let i = 0; i < CONFIG.PUZZLE_PIECES_MEMORY; i++) {
                const piece = new PuzzlePiece('plane', 'memory');
                if (!piece.missing) {
                    scene.add(piece.mesh);
                    puzzlePieces.push(piece);
                }
            }

            lightRig.setWorld('memory');

            // Floating text sprites
            setTimeout(() => {
                const messages = [
                    "Would you like to delete this memory?",
                    "You are about to connect emotionally. Continue?",
                    "Are you still you?"
                ];

                messages.forEach((msg, idx) => {
                    const canvas = document.createElement('canvas');
                    canvas.width = 512;
                    canvas.height = 128;
                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = 'rgba(200, 180, 140, 0.6)';
                    ctx.font = '20px "Courier New"';
                    ctx.textAlign = 'center';
                    ctx.fillText(msg, 256, 64);

                    const texture = new THREE.CanvasTexture(canvas);
                    const material = new THREE.SpriteMaterial({ map: texture, transparent: true });
                    const sprite = new THREE.Sprite(material);
                    sprite.scale.set(8, 2, 1);
                    sprite.position.set(
                        (Math.random() - 0.5) * 30,
                        3 + Math.random() * 2,
                        (Math.random() - 0.5) * 30
                    );
                    scene.add(sprite);
                });
            }, 1000);
        }

        function clearScene() {
            // Remove all dynamic objects
            strings.forEach(s => scene.remove(s.group));
            if (hand) scene.remove(hand);
            particleFields.forEach(p => scene.remove(p.points));
            puzzlePieces.forEach(p => scene.remove(p.mesh));
            meltPlanes.forEach(m => scene.remove(m));

            strings = [];
            hand = null;
            particleFields = [];
            puzzlePieces = [];
            meltPlanes = [];
            stringProgress = [0, 0, 0];
            snapAnimProgress = 0;

            scene.fog = null;

            // Clear world text
            document.getElementById('world-text').style.opacity = '0';
            document.getElementById('center-text').style.opacity = '0';
            document.getElementById('white-overlay').style.opacity = '0';
        }

        // ========== INPUT HANDLING ==========
        function setupInput() {
            // Keyboard
            window.addEventListener('keydown', e => {
                keys[e.key.toLowerCase()] = true;
                if (!firstInput && (e.key.toLowerCase() === 'w' || e.key.toLowerCase() === 'a' ||
                    e.key.toLowerCase() === 's' || e.key.toLowerCase() === 'd' ||
                    e.key.toLowerCase() === 'arrowup' || e.key.toLowerCase() === 'arrowdown' ||
                    e.key.toLowerCase() === 'arrowleft' || e.key.toLowerCase() === 'arrowright')) {
                    firstInput = true;
                    document.getElementById('intro-text').style.opacity = '0';
                }
                if (e.key.toLowerCase() === 'r') {
                    reset();
                }
            });
            window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

            // Mouse look
            window.addEventListener('mousedown', e => {
                if (e.button === 2) {
                    mouseDown = true;
                    e.preventDefault();
                }
            });
            window.addEventListener('mouseup', () => mouseDown = false);
            window.addEventListener('mousemove', e => {
                if (mouseDown) {
                    if (!firstInput) {
                        firstInput = true;
                        document.getElementById('intro-text').style.opacity = '0';
                    }
                    player.yaw -= e.movementX * CONFIG.LOOK_SENSITIVITY;
                    player.pitch -= e.movementY * CONFIG.LOOK_SENSITIVITY;
                    player.pitch = Math.max(-Math.PI / 3, Math.min(Math.PI / 3, player.pitch));
                }
            });
            window.addEventListener('contextmenu', e => e.preventDefault());

            // Mobile controls
            if (mobile) {
                setupMobileControls();
            }

            // Hide helper text after 6s
            setTimeout(() => {
                document.getElementById('helper-text').style.opacity = '0';
            }, 6000);
        }

        function setupMobileControls() {
            const joystick = document.querySelector('.joystick');
            const stick = document.querySelector('.joystick-stick');
            const lookArea = document.querySelector('.look-area');

            // Joystick
            joystick.addEventListener('touchstart', e => {
                e.preventDefault();
                joystickActive = true;
            });

            joystick.addEventListener('touchmove', e => {
                e.preventDefault();
                if (!joystickActive) return;

                const touch = e.touches[0];
                const rect = joystick.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;
                const dx = touch.clientX - centerX;
                const dy = touch.clientY - centerY;
                const dist = Math.min(Math.sqrt(dx * dx + dy * dy), 40);
                const angle = Math.atan2(dy, dx);

                joystickDelta.x = Math.cos(angle) * (dist / 40);
                joystickDelta.y = Math.sin(angle) * (dist / 40);

                stick.style.transform = `translate(${Math.cos(angle) * dist}px, ${Math.sin(angle) * dist}px)`;
            });

            joystick.addEventListener('touchend', () => {
                joystickActive = false;
                joystickDelta.x = 0;
                joystickDelta.y = 0;
                stick.style.transform = 'translate(0, 0)';
            });

            // Look area
            let lastTouchX = 0, lastTouchY = 0;
            lookArea.addEventListener('touchstart', e => {
                lastTouchX = e.touches[0].clientX;
                lastTouchY = e.touches[0].clientY;
            });

            lookArea.addEventListener('touchmove', e => {
                e.preventDefault();
                const touch = e.touches[0];
                const dx = touch.clientX - lastTouchX;
                const dy = touch.clientY - lastTouchY;

                player.yaw -= dx * CONFIG.LOOK_SENSITIVITY * 2;
                player.pitch -= dy * CONFIG.LOOK_SENSITIVITY * 2;
                player.pitch = Math.max(-Math.PI / 3, Math.min(Math.PI / 3, player.pitch));

                lastTouchX = touch.clientX;
                lastTouchY = touch.clientY;
            });
        }

        function handleMovement(delta) {
            const moveVector = new THREE.Vector3();

            // Desktop input
            if (keys['w'] || keys['arrowup']) moveVector.z -= 1;
            if (keys['s'] || keys['arrowdown']) moveVector.z += 1;
            if (keys['a'] || keys['arrowleft']) moveVector.x -= 1;
            if (keys['d'] || keys['arrowright']) moveVector.x += 1;

            // Mobile input
            if (mobile && joystickActive) {
                moveVector.x += joystickDelta.x;
                moveVector.z += joystickDelta.y;
            }

            if (moveVector.length() > 0) {
                moveVector.normalize();

                // Rotate by yaw
                const cos = Math.cos(player.yaw);
                const sin = Math.sin(player.yaw);
                const rotatedX = moveVector.x * cos - moveVector.z * sin;
                const rotatedZ = moveVector.x * sin + moveVector.z * cos;

                player.velocity.x = rotatedX * CONFIG.MOVE_SPEED;
                player.velocity.z = rotatedZ * CONFIG.MOVE_SPEED;
            } else {
                player.velocity.x *= 0.9;
                player.velocity.z *= 0.9;
            }

            player.position.x += player.velocity.x * delta;
            player.position.z += player.velocity.z * delta;

            // Update camera with shake
            camera.position.copy(player.position);
            camera.rotation.order = 'YXZ';
            camera.rotation.y = player.yaw + cameraShake.x;
            camera.rotation.x = player.pitch + cameraShake.y;
        }

        // ========== UPDATE FUNCTIONS ==========
        function updateVoidChoice(time, delta) {
            // Update hand animation - gentle breathing
            if (hand) {
                const breathe = Math.sin(time * 1.2) * 0.02;
                hand.position.y = hand.userData.baseY + breathe;
                hand.rotation.x = -0.2 + Math.sin(time * 0.8) * 0.03;

                // Finger curl animation
                hand.children.forEach((child, idx) => {
                    if (child.userData.curveAmount) {
                        const curl = Math.sin(time * 1.5 + idx * 0.5) * child.userData.curveAmount;
                        child.rotation.x = curl * 0.2;
                    }
                });
            }

            // Update strings and check alignment
            const moveDir = new THREE.Vector3(player.velocity.x, 0, player.velocity.z);
            const isMoving = moveDir.length() > 0.1;
            if (isMoving) moveDir.normalize();

            let maxProgress = 0;
            let maxIdx = -1;

            strings.forEach((string, idx) => {
                let alignment = 0;

                if (isMoving) {
                    alignment = moveDir.dot(string.direction);
                    alignment = Math.max(0, (alignment - 0.85) * 6.67); // Within ~30 degrees
                }

                if (alignment > 0.3) {
                    stringProgress[idx] = Math.min(1, stringProgress[idx] + delta * CONFIG.CHOICE_PROGRESS_SPEED);
                    // Decay others
                    strings.forEach((_, i) => {
                        if (i !== idx) {
                            stringProgress[i] = Math.max(0, stringProgress[i] - delta * CONFIG.CHOICE_PROGRESS_SPEED * 0.6);
                        }
                    });
                } else {
                    stringProgress[idx] = Math.max(0, stringProgress[idx] - delta * CONFIG.CHOICE_PROGRESS_SPEED * 0.4);
                }

                if (stringProgress[idx] > maxProgress) {
                    maxProgress = stringProgress[idx];
                    maxIdx = idx;
                }
            });

            // Update each string's visuals
            strings.forEach((string, idx) => {
                const isChosen = idx === maxIdx && maxProgress > 0.3;
                const isFading = idx !== maxIdx && maxProgress > 0.3;
                string.update(time, delta, isChosen, isFading);
            });

            // Camera shake based on progress
            if (maxProgress > 0.5) {
                const shakeIntensity = (maxProgress - 0.5) * 2; // 0 to 1
                cameraShake.x = (Math.random() - 0.5) * shakeIntensity * 0.002;
                cameraShake.y = (Math.random() - 0.5) * shakeIntensity * 0.002;
            } else {
                cameraShake.x *= 0.8;
                cameraShake.y *= 0.8;
            }

            // Check for completion
            if (maxProgress >= 1.0) {
                state = 'TRANSITION';
                chosenPath = strings[maxIdx].name;
                transitionTime = 0;
                snapAnimProgress = 0;
                audioLite.playSnap();
            }

            // Draw progress ring
            drawProgressRing(maxProgress);
        }

        function updateTransition(time, delta) {
            transitionTime += delta;
            snapAnimProgress = Math.min(1, transitionTime / 0.8);

            const chosenString = strings.find(s => s.name === chosenPath);

            // String tension and vibration (0 to 0.5s)
            if (transitionTime < 0.5) {
                const tension = snapAnimProgress * 2; // 0 to 1 over 0.5s
                strings.forEach(string => {
                    if (string.name === chosenPath) {
                        // Vibrate the chosen string
                        const vibrate = Math.sin(time * 50) * tension * 0.02;
                        string.group.rotation.z = vibrate;
                        string.group.scale.x = 1 + tension * 0.3;
                        // Increase glow intensity
                        string.mesh.material.emissiveIntensity = 1.5 + tension * 3;
                    }
                });

                // Intense camera shake
                cameraShake.x = (Math.random() - 0.5) * tension * 0.008;
                cameraShake.y = (Math.random() - 0.5) * tension * 0.008;
            }

            // Snap and fade to white (0.5s onwards)
            if (transitionTime >= 0.5) {
                const fadeProgress = (transitionTime - 0.5) / 0.7; // 0 to 1 over 0.7s

                // Fade hand
                if (hand) {
                    hand.traverse(child => {
                        if (child.material && child.material.opacity !== undefined) {
                            child.material.opacity = Math.max(0, 0.85 - fadeProgress * 0.85);
                        }
                    });
                }

                // Fade strings
                strings.forEach(string => {
                    string.mesh.material.opacity = Math.max(0, 1 - fadeProgress);
                    string.mesh.material.transparent = true;
                    string.halo.material.opacity = Math.max(0, 0.25 - fadeProgress * 0.25);
                });

                // Fade to white overlay
                document.getElementById('white-overlay').style.opacity = fadeProgress.toString();

                // Move camera forward slightly
                const moveAmount = delta * 2;
                player.position.add(chosenString.direction.clone().multiplyScalar(moveAmount));
                camera.position.copy(player.position);
            }

            // Complete transition
            if (transitionTime >= 1.2) {
                if (chosenPath === 'logic') buildLogicWorld();
                else if (chosenPath === 'emotion') buildEmotionWorld();
                else if (chosenPath === 'memory') buildMemoryWorld();

                state = chosenPath.toUpperCase();
                audioLite.setWorld(chosenPath);

                // Fade white overlay back out
                setTimeout(() => {
                    document.getElementById('white-overlay').style.opacity = '0';
                }, 500);
            }
        }

        function updateLogicWorld(time, delta) {
            puzzlePieces.forEach(piece => piece.update(time, delta, player.position));

            // Check for completion
            const snappedCount = puzzlePieces.filter(p => p.snapped).length;
            if (snappedCount >= CONFIG.PUZZLE_PIECES_LOGIC * 0.8) {
                showEndText("Stability achieved. Feeling: none.");
            }
        }

        function updateEmotionWorld(time, delta) {
            // Update melt planes
            const releaseActive = keys[' '];
            const amplitude = releaseActive ? 0.2 : 0.8;

            meltPlanes.forEach(mesh => {
                const geo = mesh.geometry;
                const positions = geo.attributes.position;
                const originalPos = mesh.userData.originalPositions;

                for (let i = 0; i < positions.count; i++) {
                    const orig = originalPos[i];
                    const wave = Math.sin(time * 2 + mesh.userData.phaseOffset + i * 0.5) * amplitude;
                    positions.setY(i, orig.y + wave);
                }
                positions.needsUpdate = true;
            });

            // Update particles
            particleFields.forEach(pf => pf.update(time, delta, 'emotion'));
        }

        function updateMemoryWorld(time, delta) {
            puzzlePieces.forEach(piece => piece.update(time, delta, player.position));
        }

        function showEndText(text) {
            const centerText = document.getElementById('center-text');
            centerText.textContent = text;
            centerText.style.opacity = '1';
        }

        function drawProgressRing(progress) {
            const canvas = document.getElementById('progress-ring');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, 60, 60);

            if (progress > 0) {
                ctx.strokeStyle = 'rgba(255,255,255,0.8)';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(30, 30, 25, -Math.PI / 2, -Math.PI / 2 + progress * Math.PI * 2);
                ctx.stroke();
            }
        }

        // ========== MAIN LOOP ==========
        function animate() {
            requestAnimationFrame(animate);

            const delta = Math.min(clock.getDelta(), 0.1);
            const time = clock.getElapsedTime();

            // Performance monitoring
            frameCount++;
            deltaSum += delta;
            if (frameCount >= CONFIG.PERFORMANCE_CHECK_INTERVAL) {
                const avgDelta = deltaSum / frameCount;
                if (avgDelta > 0.03 && performanceMode === 'normal') {
                    console.warn('Performance degradation detected, reducing quality');
                    performanceMode = 'low';
                    particleFields.forEach(pf => {
                        pf.count = Math.floor(pf.count / 2);
                    });
                }
                frameCount = 0;
                deltaSum = 0;
            }

            // Handle movement
            if (state !== 'TRANSITION') {
                handleMovement(delta);
            }

            // Update based on state
            if (state === 'VOID_CHOICE') {
                updateVoidChoice(time, delta);
            } else if (state === 'TRANSITION') {
                updateTransition(time, delta);
            } else if (state === 'LOGIC') {
                updateLogicWorld(time, delta);
            } else if (state === 'EMOTION') {
                updateEmotionWorld(time, delta);
            } else if (state === 'MEMORY') {
                updateMemoryWorld(time, delta);
            }

            // Update light rig
            lightRig.update(time, delta);

            renderer.render(scene, camera);
        }

        // ========== RESET ==========
        function reset() {
            state = 'VOID_CHOICE';
            chosenPath = null;
            player.position.set(0, 1.6, 5);
            player.velocity.set(0, 0, 0);
            player.yaw = 0;
            player.pitch = 0;
            stringProgress = [0, 0, 0];
            cameraShake = { x: 0, y: 0 };
            snapAnimProgress = 0;
            firstInput = false;

            buildVoidScene();

            document.getElementById('center-text').style.opacity = '0';
            document.getElementById('white-overlay').style.opacity = '0';
            document.getElementById('helper-text').style.opacity = '1';
            setTimeout(() => {
                document.getElementById('helper-text').style.opacity = '0';
            }, 6000);
        }

        // ========== INITIALIZATION ==========
        function init() {
            // Scene
            scene = new THREE.Scene();

            // Camera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, CONFIG.CAMERA_FAR);
            camera.position.copy(player.position);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, CONFIG.MAX_PIXEL_RATIO));
            renderer.outputEncoding = THREE.sRGBEncoding;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.0;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // Clock
            clock = new THREE.Clock();

            // Systems
            audioLite = new AudioLite();
            lightRig = new LightRig(scene);

            // Initialize audio on first interaction
            window.addEventListener('click', () => audioLite.init(), { once: true });
            window.addEventListener('touchstart', () => audioLite.init(), { once: true });

            // Input
            setupInput();

            // Build initial scene
            buildVoidScene();

            // Handle resize
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            // Start
            animate();
        }

        // Start everything
        init();
    </script>
</body>
</html>
